name: Release Docker Images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version consistency
        run: ./scripts/check-version.sh
      - name: Read version and channel
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' wara.version.toml)"
          if [[ "$version" == *"-beta-"* ]]; then
            channel="beta"
          elif [[ "$version" == *"-"* ]]; then
            channel="prerelease"
          else
            channel="stable"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  docker-images:
    name: Build and publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: wara-backend
            context: ./backend
            file: ./backend/Dockerfile
            target: ""
          - name: wara-frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: ""
          - name: wara-temporal
            context: ./temporal
            file: ./temporal/Dockerfile
            target: prod
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ needs.validate-version.outputs.version }}
            type=raw,value=${{ needs.validate-version.outputs.channel }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
