services:
  temporal-postgresql:
    image: postgres:${TEMPORAL_POSTGRESQL_VERSION:-16}
    environment:
      - POSTGRES_PASSWORD=${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal:
    image: wara-temporal:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        TEMPORAL_VERSION: ${TEMPORAL_VERSION:-1.30.1}
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=${TEMPORAL_POSTGRES_PORT:-5432}
      - POSTGRES_USER=${TEMPORAL_POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=temporal-postgresql
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - TEMPORAL_NAMESPACES=${TEMPORAL_NAMESPACES:-default}
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - ${TEMPORAL_FRONTEND_PORT:-7233}:7233
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.34.0}
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:4200,http://localhost:8080}
    ports:
      - ${TEMPORAL_UI_PORT:-8081}:8080

volumes:
  temporal-postgresql-data:

